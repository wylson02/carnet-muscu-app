<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="description" content="Carnet d'entraînement hors-ligne — Système Fluide" />

    <!-- iOS : plein écran une fois ajouté à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carnet" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Polices auto-hébergées : aucune requête réseau, donc rien ne change en avion.
         %BASE_URL% (substitué par Vite au build) plutôt qu'un chemin absolu : l'app
         peut être servie depuis la racine du domaine (Vercel) ou depuis /<repo>/
         (GitHub Pages) sans rien changer d'autre. -->
    <link rel="preload" href="%BASE_URL%fonts/Archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/IBMPlexMono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />

    <title>Carnet Système Fluide</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
