name: Déploiement GitHub Pages

# Construit l'app avec GH_PAGES=true (base /carnet-muscu-app/) et la publie sur
# GitHub Pages. Premier run réussi = Pages s'active tout seul, aucun réglage
# manuel dans les paramètres du dépôt.

on:
  push:
    branches:
      - claude/pwa-workout-tracker-offline-aexb45
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
      # Active Pages (source « GitHub Actions ») au premier run si ce n'est pas
      # déjà fait — sans ça, le job deploy échoue faute d'environnement Pages.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
