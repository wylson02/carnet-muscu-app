name: Déploiement GitHub Pages

# Construit l'app avec GH_PAGES=true (base /carnet-muscu-app/) et la publie sur
# GitHub Pages. Premier run réussi = Pages s'active tout seul, aucun réglage
# manuel dans les paramètres du dépôt.

on:
  push:
    branches:
      - claude/pwa-workout-tracker-offline-aexb45
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Un seul job, sans bloc `environment:` : les trois runs précédents ont
  # échoué au moment de planifier le job `deploy` sur un `environment:
  # github-pages` (échec instantané, aucun runner assigné, aucun log — le
  # signe d'une résolution d'environnement qui ne se fait pas pour ce compte).
  # `actions/deploy-pages` n'a pas besoin d'un `environment:` de job pour
  # fonctionner ; ça sert seulement à afficher l'URL dans l'onglet
  # Environments. On s'en passe.
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
