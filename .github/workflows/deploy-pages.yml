name: Déploiement GitHub Pages

# Construit l'app avec GH_PAGES=true (base /carnet-muscu-app/) et la publie sur
# GitHub Pages. Premier run réussi = Pages s'active tout seul, aucun réglage
# manuel dans les paramètres du dépôt.

on:
  push:
    branches:
      - claude/pwa-workout-tracker-offline-aexb45
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # deploy-pages exige ce bloc — sans lui, l'API refuse le déploiement
    # (HTTP 400 « Missing environment »). Si ce job échoue immédiatement,
    # sans runner assigné ni logs, c'est que l'environnement « github-pages »
    # (créé automatiquement par configure-pages ci-dessous) a une politique de
    # branches restreinte : Settings → Environments → github-pages →
    # Deployment branches → autorise cette branche, ou repasse en
    # « No restriction ».
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
